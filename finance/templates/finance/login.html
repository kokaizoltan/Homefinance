{% extends "base.html" %}
{% load static %}

{% block title %}Bejelentkezés{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="card auth-card shadow-sm border-0">
            <div class="card-body p-4 p-lg-5">
                <div class="text-center mb-4">
                    <div class="auth-icon mx-auto mb-3"><i class="bi bi-shield-lock"></i></div>
                    <h1 class="h3 fw-semibold mb-1">Bejelentkezés</h1>
                    <p class="text-muted mb-0">Jelentkezz be az e-mail-címeddel és a jelszavaddal.</p>
                </div>

                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include "finance/_form_fields.html" %}

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Bejelentkezés
                    </button>
                </form>

                <p class="text-center text-muted mt-4 mb-0">
                    Még nincs fiókod?
                    <a href="{% url 'finance:register' %}" class="fw-medium">Regisztrálj itt</a>.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
