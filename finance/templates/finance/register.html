{% extends "base.html" %}

{% block title %}Regisztráció{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card auth-card shadow-sm border-0">
            <div class="card-body p-4 p-lg-5">
                <div class="text-center mb-4">
                    <div class="auth-icon mx-auto mb-3"><i class="bi bi-person-plus"></i></div>
                    <h1 class="h3 fw-semibold mb-1">Fiók létrehozása</h1>
                    <p class="text-muted mb-0">Pár adat, és kezdheted is a pénzügyeid nyilvántartását.</p>
                </div>

                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include "finance/_form_fields.html" %}

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold">
                            <i class="bi bi-check2-circle me-1"></i>Regisztráció
                        </button>
                        <a href="{% url 'finance:login' %}" class="btn btn-outline-secondary">Már van fiókom</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
